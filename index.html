<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stipple — Convert images into stippling art using genetic algorithms." />
    <title>Stipple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* ================================================================
         STIPPLE — Minimal Interface
         Design: Maximum whitespace, invisible UI, neutral palette
         ================================================================ */

      :root {
        --bg: #fafafa;
        --bg-canvas: #ffffff;
        --text: #1a1a1a;
        --text-secondary: #888888;
        --text-muted: #b0b0b0;
        --border: #e8e8e8;
        --border-hover: #d0d0d0;
        --accent: #1a1a1a;
        --accent-soft: #555555;
        --accent-bg: rgba(0, 0, 0, 0.04);
        --radius: 8px;
        --radius-sm: 6px;
        --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --transition: 0.2s ease;
      }

      /* ---- Reset ---- */
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
      }

      /* ---- Layout ---- */
      .app {
        max-width: 1320px;
        margin: 0 auto;
        padding: 48px 40px;
      }

      /* ---- Header ---- */
      .header {
        margin-bottom: 56px;
      }

      .header h1 {
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text);
      }

      .header p {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 4px;
        font-weight: 400;
      }

      /* ---- Main Split Layout ---- */
      .workspace {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 64px;
        align-items: start;
      }

      /* ---- Sidebar Controls ---- */
      .sidebar {
        position: sticky;
        top: 48px;
        display: flex;
        flex-direction: column;
        gap: 36px;
      }

      .control-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .section-label {
        font-size: 0.68rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ---- Controls ---- */
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-size: 0.75rem;
        font-weight: 400;
        color: var(--text-secondary);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      .field-value {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      /* Slider */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 1px;
        background: var(--border);
        outline: none;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: var(--bg-canvas);
        border: 1.5px solid var(--text-secondary);
        border-radius: 50%;
        cursor: pointer;
        transition: border-color var(--transition), box-shadow var(--transition);
      }

      input[type="range"]::-webkit-slider-thumb:hover {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.06);
      }

      input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        background: var(--bg-canvas);
        border: 1.5px solid var(--text-secondary);
        border-radius: 50%;
        cursor: pointer;
      }

      /* File Upload */
      #imgInput {
        display: none;
      }

      .upload-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 10px 16px;
        background: var(--bg-canvas);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-family: var(--font);
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all var(--transition);
      }

      .upload-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
        background: var(--accent-bg);
      }

      .upload-icon {
        width: 14px;
        height: 14px;
        opacity: 0.5;
      }

      /* Number Input */
      #dotCountInput {
        font-family: var(--font);
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text);
        background: var(--bg-canvas);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        width: 100%;
        outline: none;
        transition: border-color var(--transition);
        -moz-appearance: textfield;
        appearance: textfield;
      }

      #dotCountInput::-webkit-outer-spin-button,
      #dotCountInput::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      #dotCountInput:focus {
        border-color: var(--accent);
      }

      /* Status readout */
      #recommendedDotCount {
        font-size: 0.72rem;
        color: var(--text-muted);
        line-height: 1.55;
        min-height: 20px;
      }

      /* ---- Separator ---- */
      .separator {
        width: 100%;
        height: 1px;
        background: var(--border);
      }

      /* ---- Buttons ---- */
      .btn-group {
        display: flex;
        gap: 8px;
      }

      .btn-group.export-group {
        flex-wrap: wrap;
      }

      button {
        font-family: var(--font);
        font-size: 0.78rem;
        font-weight: 500;
        padding: 9px 20px;
        border-radius: 100px;
        border: 1px solid var(--border);
        background: var(--bg-canvas);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all var(--transition);
        white-space: nowrap;
      }

      button:hover:not(:disabled) {
        border-color: var(--border-hover);
        color: var(--text);
        background: var(--accent-bg);
      }

      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      #start {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      #start:hover:not(:disabled) {
        background: var(--accent-soft);
        border-color: var(--accent-soft);
        color: #ffffff;
      }

      #stop {
        color: var(--text-secondary);
      }

      #exportSvg,
      #exportPng,
      #exportTimelapse {
        font-size: 0.72rem;
        padding: 7px 14px;
      }

      /* ---- Canvas Area ---- */
      .canvas-area {
        display: flex;
        flex-direction: column;
        gap: 40px;
      }

      .canvas-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .canvas-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      .canvas-label {
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.02em;
      }

      .canvas-info {
        font-size: 0.65rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .canvas-wrap {
        background: var(--bg-canvas);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        position: relative;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .canvas-wrap::before {
        content: 'No image';
        position: absolute;
        font-size: 0.78rem;
        color: var(--text-muted);
        pointer-events: none;
        z-index: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border: none;
        position: relative;
        z-index: 1;
      }

      #imgCanvas,
      #bwCanvas,
      #evolCanvas {
        margin: 0;
        max-width: 100%;
        height: auto;
        object-fit: contain;
      }

      /* ---- Footer ---- */
      .footer {
        margin-top: 72px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        font-size: 0.7rem;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
      }

      /* ---- Evolution running ---- */
      .evolution-running #start {
        opacity: 0.5;
      }

      /* ---- Responsive ---- */
      @media (max-width: 880px) {
        .app {
          padding: 32px 24px;
        }
        .workspace {
          grid-template-columns: 1fr;
          gap: 40px;
        }
        .sidebar {
          position: static;
        }
        .header {
          margin-bottom: 36px;
        }
      }

      @media (max-width: 480px) {
        .app {
          padding: 24px 16px;
        }
        .btn-group {
          flex-direction: column;
        }
        .btn-group button {
          width: 100%;
        }
      }

      /* ---- Scrollbar ---- */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="app">

      <!-- Header -->
      <header class="header">
        <h1>Stipple</h1>
        <p>Image to stippling art, powered by genetic algorithms</p>
      </header>

      <!-- Workspace -->
      <div class="workspace">

        <!-- Sidebar: Controls -->
        <aside class="sidebar">

          <!-- Image -->
          <div class="control-section">
            <span class="section-label">Image</span>
            <div class="control-group">
              <label for="imgInput" class="upload-btn" id="fileUploadLabel">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Upload image
              </label>
              <input type="file" id="imgInput" accept="image/*" />
            </div>
          </div>

          <!-- Processing -->
          <div class="control-section">
            <span class="section-label">Processing</span>
            <div class="control-group">
              <div class="field">
                <div class="field-label">
                  <span>Blur</span>
                  <span class="field-value" id="blurValue">0</span>
                </div>
                <input type="range" id="blurAmount" min="0" max="10" value="0" />
              </div>
              <div class="field">
                <div class="field-label">
                  <span>Threshold</span>
                  <span class="field-value" id="thresholdValue">128</span>
                </div>
                <input type="range" id="threshold" min="0" max="255" value="128" />
              </div>
            </div>
          </div>

          <!-- Evolution -->
          <div class="control-section">
            <span class="section-label">Evolution</span>
            <div class="control-group">
              <div class="field">
                <div class="field-label">
                  <span>Dot count</span>
                </div>
                <input
                  type="number"
                  id="dotCountInput"
                  min="1000"
                  max="200000"
                  placeholder="Auto" />
              </div>
              <div id="recommendedDotCount"></div>
            </div>
          </div>

          <div class="separator"></div>

          <div class="btn-group">
            <button id="start">Start</button>
            <button id="stop" disabled>Stop</button>
          </div>

          <div class="btn-group export-group">
            <button id="exportSvg" disabled>SVG</button>
            <button id="exportPng" disabled>PNG</button>
            <button id="exportTimelapse" disabled>Timelapse</button>
          </div>

        </aside>

        <!-- Canvas Area -->
        <main class="canvas-area">

          <div class="canvas-panel" id="viewportSource">
            <div class="canvas-meta">
              <span class="canvas-label">Original</span>
              <span class="canvas-info viewport-footer"><span>—</span></span>
            </div>
            <div class="canvas-wrap">
              <canvas id="imgCanvas"></canvas>
            </div>
          </div>

          <div class="canvas-panel" id="viewportProcessed">
            <div class="canvas-meta">
              <span class="canvas-label">Black & White</span>
              <span class="canvas-info viewport-footer"><span>—</span></span>
            </div>
            <div class="canvas-wrap">
              <canvas id="bwCanvas"></canvas>
            </div>
          </div>

          <div class="canvas-panel" id="viewportEvolution">
            <div class="canvas-meta">
              <span class="canvas-label">Stippled</span>
              <span class="canvas-info viewport-footer"><span>Gen 0</span>&nbsp;·&nbsp;<span>—</span></span>
            </div>
            <div class="canvas-wrap">
              <canvas id="evolCanvas"></canvas>
            </div>
          </div>

        </main>

      </div>

      <!-- Footer -->
      <footer class="footer">
        <span></span>
        <span>Genetic algorithm engine</span>
      </footer>

    </div>

    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
