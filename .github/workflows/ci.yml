name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten

      - name: Build web app
        run: npm run build

  native-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure native build
        run: cmake -S cpp -B cpp/build

      - name: Build native targets
        run: cmake --build cpp/build

      - name: Run native tests
        run: ctest --test-dir cpp/build --output-on-failure
